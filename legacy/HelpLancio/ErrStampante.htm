<H1>Problemi con la stampante predefinita</H1>
<P>Non è stato possibile recuperare il nome della stampante predefinita.</P>
<P>E' possibile che non sia definita alcuna stampante</P>
<P>Per risolvere il problema si consiglia di accedere alle definizioni delle stampanti nel pannello di controllo di Windows.</P>
