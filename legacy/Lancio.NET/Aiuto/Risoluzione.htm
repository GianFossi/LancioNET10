<H1>Risoluzione dello schermo</H1>
<P>La risoluzione minima raccomandata è 1024 x 768.</P>
<P>Con risoluzioni inferiori alcune applicazioni del sistema Lancio non funzioneranno in modo soddisfacente, o, al limite, non potranno funzionare affatto.</P>
