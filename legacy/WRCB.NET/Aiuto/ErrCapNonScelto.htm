<H1>Capitolo non selezionato</H1>
<P>Il pulsante 'Visualizza' consente di visualizzare un determinato capitolo del rapporto di calcolo. Per ottenere ciò è necessario selezionare il capitolo desiderato dal pannello del rapporto prima di premere il pulsante 'Visualizza'.</P>
