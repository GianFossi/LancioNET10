<H1>Manuale del programmatore</H1>
<P>Il programma Traccia è realizzato sotto forma di una dll ActiveX, la quale espone un unico oggetto di nome '<A href="objTraccia.htm">Tracciatura</A>'.</P>
<P>Essa possiede inoltre un oggetto privato di nome <A href="html/ManProMonitor.htm">Monitor</A>.</P>
<P>I moduli <A href="modStandard.htm">standard</A>, i <A href="Forms.htm">form</A>, e il file di risorse 'header.res' completano il programma.</P>
