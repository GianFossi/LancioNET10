<H1>Diaframmi</H1>
<H2>Spessore minimo</H2>
<P>Lo spessore minimo a norme TEMA è calcolato a partire dalle tabelle R-4.41 e CB-4.41. Le tabelle sono caricate nel file di libreria ArchDir\DIAF03.DAT. Il calcolo è eseguito dal <A href="ManHTML\OggDiafUnsupported.htm">metodo Unsupported</A> dell'oggetto <A href="ManOggDiaf.htm">Diaframma</A>.</P>
